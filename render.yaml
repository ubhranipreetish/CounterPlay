services:
  - type: web
    name: counterplay-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FRONTEND_URL
        sync: false
